<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S&amp;S Productions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#fff;--mute:#b5b5b5;--line:#333;--display:"Anton","Impact","Arial Narrow",sans-serif;--body:"Work Sans","Helvetica Neue",Arial,sans-serif;--pad:clamp(1rem,4vw,3rem)}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:400 1rem/1.6 var(--body);min-height:100vh}
a{color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
header{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;padding:1rem var(--pad);background:rgba(0,0,0,.88);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.logo{font:1.6rem/1 var(--display);letter-spacing:.04em;text-decoration:none}
.right{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
nav{display:flex;gap:.25rem}
nav button{background:none;border:0;color:var(--mute);font:500 1rem var(--body);padding:.5rem .8rem;cursor:pointer;border-bottom:2px solid transparent}
nav button:hover{color:var(--fg)}
nav button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.lang{display:flex;border:1px solid var(--line)}
.lang button{background:none;border:0;color:var(--mute);font:500 .85rem var(--body);padding:.35rem .6rem;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
section[hidden]{display:none}
.wrap{padding:0 var(--pad) 4rem}
.band{position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:flex-end;padding:var(--pad)}
.band .bg{position:absolute;inset:-25% 0;background:linear-gradient(135deg,#1a1a1a,#2c2c2c) center/cover;background-image:var(--img),linear-gradient(135deg,#1a1a1a,#2c2c2c);will-change:transform}
.band .bg::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.10)}
.band>.in{position:relative;width:100%}
.hero{min-height:calc(100svh - 4.5rem);align-items:center;text-align:center}
.hero h1{font:clamp(4rem,19vw,15rem)/.88 var(--display);text-transform:uppercase}
.hero h1 img{display:block;width:min(100%,80rem);height:auto;margin:0 auto;mix-blend-mode:screen;filter:brightness(1.8)}
.hero p{margin:1.25rem auto 0;max-width:34rem;font-size:1.2rem}
.text{min-height:90vh;align-items:center}
.text .in{max-width:40rem;text-shadow:0 0 6px #000,0 0 14px rgba(0,0,0,.9),0 0 30px rgba(0,0,0,.7)}
.text p+p{margin-top:1rem}
.cta{min-height:70vh;align-items:center;justify-content:center;text-align:center}
.cta .in{display:grid;justify-items:center;gap:1.5rem}
h2{font:clamp(2rem,5vw,3.5rem)/1 var(--display);text-transform:uppercase;margin:0 0 1.25rem}
.wrap h2{margin-top:2.5rem}
.btn{display:inline-block;background:var(--fg);color:var(--bg);border:0;padding:.9rem 2rem;font:1.1rem var(--display);letter-spacing:.05em;cursor:pointer;text-decoration:none}
.btn:hover{background:#d6d6d6}
.filters{display:flex;gap:.5rem;margin-bottom:1.5rem;flex-wrap:wrap}
.filters button{background:none;color:var(--fg);border:1px solid var(--line);padding:.45rem 1rem;font:500 .95rem var(--body);cursor:pointer;border-radius:2rem}
.filters button:hover{border-color:var(--fg)}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,18rem),1fr));gap:.75rem}
.tile{position:relative;aspect-ratio:3/2;background-image:var(--img),linear-gradient(135deg,#1a1a1a,#2c2c2c);background-size:cover;background-position:center;overflow:hidden;cursor:pointer}
.tile.wide{grid-column:span 2;aspect-ratio:auto}
.tile:hover{filter:none}
.tile span{position:absolute;left:0;right:0;bottom:0;padding:.6rem .8rem;background:linear-gradient(transparent,rgba(0,0,0,.85));font-size:.9rem}
.tile[hidden]{display:none}
.tile[data-c="video"]::before{content:"";position:absolute;left:50%;top:50%;width:4rem;height:4rem;margin:-2rem 0 0 -2rem;border:2px solid #fff;border-radius:50%;background:rgba(0,0,0,.5)}
.tile[data-c="video"]::after{content:"";position:absolute;left:50%;top:50%;margin:-.7rem 0 0 -.35rem;border-left:1.1rem solid #fff;border-top:.7rem solid transparent;border-bottom:.7rem solid transparent}
.note{color:var(--mute);font-size:.9rem;margin-top:1.5rem;max-width:40rem}
.contact{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,20rem),1fr));gap:3rem}
.contact .lead{display:grid;gap:1.5rem;justify-items:start;align-content:start;max-width:30rem}
.contact dl{display:grid;gap:1rem;align-content:start}
.contact dt{color:var(--mute);font-size:.9rem}
#modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.93);display:grid;place-items:center;padding:1rem}
#modal[hidden]{display:none}
#stage iframe,#stage video{display:block;width:min(92vw,1100px);aspect-ratio:16/9;max-height:85vh;background:#000;border:0}
#stage img{display:block;max-width:92vw;max-height:88vh}
#close{position:absolute;top:.75rem;right:1rem;background:none;border:0;color:var(--fg);font:2.2rem/1 var(--body);cursor:pointer;padding:.25rem .6rem}
footer{border-top:1px solid var(--line);padding:1.5rem var(--pad);color:var(--mute);font-size:.9rem}
@media (max-width:30rem){.tile.wide{grid-column:auto;aspect-ratio:3/2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.band .bg{inset:0;transform:none!important}}
  .note{display:none}
</style>
</head>
<body>
<header>
  <a class="logo" href="#rolunk">S&amp;S</a>
  <div class="right">
    <nav role="tablist">
      <button role="tab" data-tab="rolunk" data-i18n="nav_about" aria-selected="true"></button>
      <button role="tab" data-tab="munkaink" data-i18n="nav_work" aria-selected="false"></button>
      <button role="tab" data-tab="kapcsolat" data-i18n="nav_contact" aria-selected="false"></button>
    </nav>
    <div class="lang" role="group" aria-label="Nyelv / Language">
      <button data-lang="hu" aria-pressed="true">HU</button>
      <button data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
</header>

<main>
  <section id="rolunk" role="tabpanel">
    <div class="band hero">
      <div class="bg" style="--img:url('images/munka-1.jpg')"></div>
      <div class="in">
        <!-- A logó: töltsd fel az images mappába logo.png néven. Ha JPG, írd át itt logo.jpg-re. -->
        <h1><img src="images/logo.png" alt="S&S Productions" onerror="this.style.display='none';this.nextElementSibling.hidden=false"><span hidden>S&amp;S<br>Productions</span></h1>
        <p data-i18n="tagline"></p>
      </div>
    </div>
    <div class="band text">
      <div class="bg" style="--img:url('images/munka-3.jpg')"></div>
      <div class="in">
        <h2 data-i18n="about_h"></h2>
        <p data-i18n="about_p1"></p>
        <p data-i18n="about_p2"></p>
        <p data-i18n="about_p3"></p>
      </div>
    </div>
    <div class="band cta">
      <div class="bg" style="--img:url('images/munka-5.jpg')"></div>
      <div class="in">
        <h2 data-i18n="cta_h"></h2>
        <a class="btn" href="#munkaink" data-i18n="cta_btn"></a>
      </div>
    </div>
  </section>

  <section id="munkaink" role="tabpanel" class="wrap" hidden>
    <h2 data-i18n="work_h"></h2>
    <div class="filters" role="group">
      <button data-f="all" data-i18n="f_all" aria-pressed="true"></button>
<button data-f="enterior" aria-pressed="false"><span data-hu="Enteriőr/Exteriőr" data-en="Interior/Exterior">Enteriőr/Exteriőr</span></button>
<button data-f="reklam" aria-pressed="false"><span data-hu="Reklám" data-en="Advertising">Reklám</span></button>
<button data-f="eskuvo" aria-pressed="false"><span data-hu="Esküvő" data-en="Wedding">Esküvő</span></button>
    </div>
    <!-- Minden munka egy sor. A cím: data-hu (magyar) és data-en (angol).
         Fotó: data-full = a nagy kép. Videó: data-yt = YouTube-azonosító VAGY data-mp4 = videófájl útvonala. -->
    <div class="grid">
      <div class="tile wide" data-c="foto" data-full="images/munka-1.jpg" tabindex="0" role="button" style="--img:url('images/munka-1.jpg')"><span data-hu="" data-en=""></span></div>
      <div class="tile" data-c="video" data-cat="reklam" data-yt="qXq39_9gYKE" data-mp4="" tabindex="0" role="button" style="--img:url('images/video-1-borito.jpg')"><span data-hu="" data-en=" "></span></div>
      <div class="tile" data-c="foto" data-cat="enterior" data-full="images/munka-3.jpg" tabindex="0" role="button" style="--img:url('images/munka-3.jpg')"><span data-hu="" data-en=""></span></div>
      <div class="tile" data-c="foto" data-cat="enterior" data-full="images/munka-4.jpg" tabindex="0" role="button" style="--img:url('images/munka-4.jpg')"><span data-hu="" data-en=""></span></div>
      <div class="tile wide" data-c="video" data-cat="reklam" data-yt="1zeYA4-Qkxc" data-mp4="" tabindex="0" role="button" style="--img:url('images/video-2-borito.jpg')"><span data-hu="" data-en=""></span></div>
      <div class="tile" data-c="foto" data-cat="eskuvo" data-full="images/munka-6.jpg" tabindex="0" role="button" style="--img:url('images/munka-6.jpg')"><span data-hu="" data-en=""></span></div>
       <div class="tile" data-c="foto" data-cat="eskuvo" data-full="images/munka-7.jpg" tabindex="0" role="button" style="--img:url('images/munka-7.jpg')"><span data-hu="" data-en=""></span></div>
      <div class="tile" data-c="foto" data-cat="enterior/exterior" data-full="images/munka-8.jpg" tabindex="0" role="button" style="--img:url('images/munka-8.jpg')"><span data-hu="" data-en=""></span></div>
      <div class="tile" data-c="foto" data-cat="enterior/exterior" data-full="images/munka-9.jpg" tabindex="0" role="button" style="--img:url('images/munka-9.jpg')"><span data-hu="" data-en=""></span></div>
      <div class="tile" data-c="foto" data-cat="reklam" data-full="images/munka-10.jpg" tabindex="0" role="button" style="--img:url('images/munka-10.jpg')"><span data-hu="" data-en=""></span></div>
      <div class="tile" data-c="foto" data-cat="reklam" data-full="images/munka-11.jpg" tabindex="0" role="button" style="--img:url('images/munka-11.jpg')"><span data-hu="" data-en=""></span></div>
      <div class="tile" data-c="foto" data-cat="reklam" data-full="images/munka-12.jpg" tabindex="0" role="button" style="--img:url('images/munka-12.jpg')"><span data-hu="" data-en=""></span></div>
      <div class="tile" data-c="foto" data-cat="reklam" data-full="images/munka-13.jpg" tabindex="0" role="button" style="--img:url('images/munka-13.jpg')"><span data-hu="" data-en=""></span></div>  
      <div class="tile" data-c="foto" data-cat="reklam" data-full="images/munka-14.jpg" tabindex="0" role="button" style="--img:url('images/munka-14.jpg')"><span data-hu="" data-en=""></span></div>
      <div class="tile" data-c="foto" data-cat="reklam" data-full="images/munka-15.jpg" tabindex="0" role="button" style="--img:url('images/munka-15.jpg')"><span data-hu="" data-en=""></span></div>
      <div class="tile" data-c="foto" data-cat="enterior" data-full="images/munka-16.jpg" tabindex="0" role="button" style="--img:url('images/munka-16.jpg')"><span data-hu="" data-en=""></span></div>
      
    </div>
    <p class="note" data-i18n="note"></p>
  </section>

  <section id="kapcsolat" role="tabpanel" class="wrap" hidden>
    <h2 data-i18n="contact_h"></h2>
    <div class="contact">
      <div class="lead">
        <p data-i18n="contact_p"></p>
        <a class="btn" data-mail data-i18n="mail_btn"></a>
      </div>
      <dl>
        <div><dt data-i18n="d_email"></dt><dd><a data-mail data-mailtext></a></dd></div>
        <div><dt data-i18n="d_phone"></dt><dd>+36 30 4310966</dd></div>
        <div><dt data-i18n="d_city"></dt><dd data-i18n="city_ph"></dd></div>
      </dl>
    </div>
  </section>
</main>

<div id="modal" hidden role="dialog" aria-modal="true">
  <button id="close" aria-label="Bezárás / Close">×</button>
  <div id="stage"></div>
</div>

<footer>© <span id="y"></span> S&amp;S Productions</footer>

<script>
(function(){
  var EMAIL = "snsvideoprod@gmail.com"; // ide írd a saját e-mail-címedet / put your e-mail address here
  var T = {
    hu:{
      nav_about:"Rólunk", nav_work:"Munkáink", nav_contact:"Kapcsolat",
      tagline:"Fotó és videó, amit nem felejtesz el.",
      about_h:"Rólunk",
      about_p1:"2020-ban indultunk kisfilmek és zenés videóklipek készítésével, azóta pedig a fotózás és videózás több területén is megtaláltuk a saját utunkat. Fő profilunk az enteriőr, az esküvői és a reklámfotózás, valamint videókészítés. Kreatív szemlélettel és a részletekre figyelve alkotunk vizuális tartalmakat, amelyek kitűnnek a tömegből.",
      cta_h:"Nézd meg a munkáinkat", cta_btn:"Munkáink megtekintése",
      work_h:"Munkáink", f_all:"Mind", f_enterior:"Enteriőr", f_reklam:"Reklám", f_eskuvo:"Esküvő",
      note:"A képek szürkeárnyalatosak, egérrel föléjük víve színesek lesznek. Kattints egy munkára a megnyitáshoz.",
      contact_h:"Kapcsolat", contact_p:"Írj nekünk e-mailben, és hamarosan válaszolunk.", mail_btn:"E-mail küldése",
      d_email:"E-mail", d_phone:"Telefon", d_city:"Város", city_ph:"Budapest",
      subj:"Üzenet a weboldalról"
    },
    en:{
      nav_about:"About", nav_work:"Work", nav_contact:"Contact",
      tagline:"Photo and video you won’t forget.",
      about_h:"About us",
      about_p1:"Founded in 2020, we started out producing short films and music videos before expanding into photography and filmmaking. Today, our main focus is interiors, weddings, and commercial content. With a creative approach and an eye for detail, we create distinctive visual content that stands out.",
      cta_h:"See our work", cta_btn:"View our work",
      work_h:"Our work", f_all:"All", f_enterior:"Interior", f_reklam:"Advertising", f_eskuvo:"Wedding",
      note:"Images are shown in black and white. Hover over one to see it in colour. Click a piece to open it.",
      contact_h:"Contact", contact_p:"Write to us by e-mail and we will get back to you soon.", mail_btn:"Send an e-mail",
      d_email:"E-mail", d_phone:"Phone", d_city:"City", city_ph:"Budapest, Hungary",
      subj:"Message from the website"
    }
  };
  var lang = "hu";
  try{ lang = localStorage.getItem("lang") || ((navigator.language||"").slice(0,2) === "hu" ? "hu" : "en"); }catch(e){ lang = (navigator.language||"").slice(0,2) === "hu" ? "hu" : "en"; }
  if(!T[lang]) lang = "hu";

  function setLang(l){
    lang = l;
    try{ localStorage.setItem("lang", l); }catch(e){}
    document.documentElement.lang = l;
    document.title = "S&S Productions – " + (l === "hu" ? "fotó és videó" : "photo and video");
    document.querySelectorAll("[data-i18n]").forEach(function(el){ el.textContent = T[l][el.dataset.i18n]; });
    document.querySelectorAll("[data-hu]").forEach(function(el){ el.textContent = el.dataset[l]; });
    document.querySelectorAll("[data-lang]").forEach(function(b){ b.setAttribute("aria-pressed", b.dataset.lang === l); });
    document.querySelectorAll("[data-mail]").forEach(function(a){ a.href = "mailto:" + EMAIL + "?subject=" + encodeURIComponent(T[l].subj); });
    document.querySelectorAll("[data-mailtext]").forEach(function(a){ a.textContent = EMAIL; });
  }
  document.querySelectorAll("[data-lang]").forEach(function(b){ b.addEventListener("click", function(){ setLang(b.dataset.lang); }); });

  var tabs = document.querySelectorAll("[data-tab]");
  function show(id){
    if(!document.getElementById(id)) id = "rolunk";
    document.querySelectorAll("main section").forEach(function(s){ s.hidden = s.id !== id; });
    tabs.forEach(function(t){ t.setAttribute("aria-selected", t.dataset.tab === id); });
    window.scrollTo(0,0);
    parallax();
  }
  tabs.forEach(function(t){ t.addEventListener("click", function(){ location.hash = t.dataset.tab; }); });
  window.addEventListener("hashchange", function(){ show(location.hash.slice(1)); });

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches, ticking = false;
  function parallax(){
    if(reduce) return;
    document.querySelectorAll(".band .bg").forEach(function(bg){
      var r = bg.parentNode.getBoundingClientRect();
      if(r.bottom < 0 || r.top > window.innerHeight) return;
      var d = r.top + r.height/2 - window.innerHeight/2;
      bg.style.transform = "translate3d(0," + (d * -0.12).toFixed(1) + "px,0)";
    });
  }
  function onScroll(){ if(!ticking){ ticking = true; requestAnimationFrame(function(){ parallax(); ticking = false; }); } }
  window.addEventListener("scroll", onScroll, {passive:true});
  window.addEventListener("resize", onScroll);

  document.querySelectorAll("[data-f]").forEach(function(b){
    b.addEventListener("click", function(){
      document.querySelectorAll("[data-f]").forEach(function(x){ x.setAttribute("aria-pressed", x === b); });
      document.querySelectorAll(".tile").forEach(function(t){ t.hidden = b.dataset.f !== "all" && t.dataset.cat !== b.dataset.f; });
    });
  });

  var modal = document.getElementById("modal"), stage = document.getElementById("stage"), closeBtn = document.getElementById("close"), lastTile = null;
  function openTile(t){
    var html = "";
    if(t.dataset.c === "video"){
      if(t.dataset.yt){
        html = '<iframe src="https://www.youtube-nocookie.com/embed/' + encodeURIComponent(t.dataset.yt) + '?autoplay=1&rel=0" allow="autoplay; encrypted-media; fullscreen" allowfullscreen title="Video"></iframe>';
      } else if(t.dataset.mp4){
        html = '<video src="' + t.dataset.mp4 + '" controls autoplay playsinline></video>';
      }
    } else if(t.dataset.full){
      html = '<img src="' + t.dataset.full + '" alt="">';
    }
    if(!html) return;
    lastTile = t;
    stage.innerHTML = html;
    modal.hidden = false;
    closeBtn.focus();
  }
  function closeModal(){
    modal.hidden = true;
    stage.innerHTML = "";
    if(lastTile) lastTile.focus();
  }
  document.querySelectorAll(".tile").forEach(function(t){
    t.addEventListener("click", function(){ openTile(t); });
    t.addEventListener("keydown", function(e){ if(e.key === "Enter" || e.key === " "){ e.preventDefault(); openTile(t); } });
  });
  closeBtn.addEventListener("click", closeModal);
  modal.addEventListener("click", function(e){ if(e.target === modal) closeModal(); });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape" && !modal.hidden) closeModal(); });

  document.getElementById("y").textContent = new Date().getFullYear();
  setLang(lang);
  show(location.hash.slice(1));
})();
</script>
</body>
</html>
